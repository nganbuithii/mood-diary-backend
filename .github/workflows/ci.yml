name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql://mood_diary:mood_diary@localhost:5432/mood_diary

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mood_diary
          POSTGRES_PASSWORD: mood_diary
          POSTGRES_DB: mood_diary
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U mood_diary"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Apply database migrations
        run: pnpm exec prisma migrate deploy

      - name: Build
        run: pnpm build

      - name: Run unit tests
        run: pnpm test
